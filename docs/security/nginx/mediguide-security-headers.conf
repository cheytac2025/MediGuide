# MediGuide security headers — PREPARED, NOT DEPLOYED
# Target: srv2179431 / https://qmhchospital.com
# Apply only after: nginx -t success + separate production approval.
#
# FIND-001 HSTS
# FIND-002 CSP Report-Only (enforce later after violation review)
# FIND-003 server_tokens (also set in http{} block)
#
# Rollback: remove this include (or comment directives) and reload nginx.

# Hide version banner (pair with http { server_tokens off; })
more_clear_headers Server;
# If headers-more module is unavailable, rely on server_tokens off alone.

# HSTS — HTTPS only. Do NOT enable includeSubDomains/preload until all
# subdomains of qmhchospital.com are confirmed HTTPS-capable.
add_header Strict-Transport-Security "max-age=15552000" always;

# Baseline browser hardening (already partially present; keep idempotent)
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# CSP Report-Only: intentionally omits 'unsafe-inline'/'unsafe-eval' so
# violations from existing dark-mode inline bootstrap in app.blade.php are
# visible without breaking pages. Enforce mode requires nonce/hash refactor.
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' https://fonts.googleapis.com; script-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;

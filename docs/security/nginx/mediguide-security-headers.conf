# MediGuide security headers — FIND-001 / FIND-002 / FIND-003
# Target: srv2179431 / https://qmhchospital.com
# Include inside the HTTPS server { } for qmhchospital.com.
#
# FIND-001 HSTS (no includeSubDomains / preload)
# FIND-002 CSP Report-Only (do not enforce yet)
# FIND-003 pair with http { server_tokens off; }
#
# Rollback: remove this include (or restore site backup) and reload nginx.

# HSTS — HTTPS only.
add_header Strict-Transport-Security "max-age=15552000" always;

# Baseline browser hardening
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# CSP Report-Only: no unsafe-inline/unsafe-eval so existing inline appearance
# bootstrap violations are visible without breaking pages. Enforce later.
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' https://fonts.googleapis.com; script-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
